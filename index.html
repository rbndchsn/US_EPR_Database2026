  <section class="intro-box">
    <h2>Why this tracker exists</h2>
    <p>
      Extended Producer Responsibility (EPR) is reshaping how producers, brand owners, and importers
      handle product end-of-life across the United States. Under EPR, the financial responsibility for
      managing a product's lifecycle moves from local governments to the producers who put the product
      on the market. Producers pay fees into a Producer Responsibility Organization, which uses those
      fees to fund collection, sortation, processing, and recycled-market development for covered packaging.
    </p>
    <p>
      The model is not new. The European Union has applied EPR to packaging since the 1990s and is
      now implementing the Packaging and Packaging Waste Regulation (PPWR), which standardizes EPR
      fees, recyclability rules, and recycled content targets across 27 member states. India enacted
      national EPR rules for plastic packaging in 2022. Similar programs are live or in development
      across Canada, Australia, the United Kingdom, Latin America, and parts of Southeast Asia.
    </p>
    <p>
      The United States is now the active frontier. Twenty states have introduced packaging EPR
      legislation, several have passed laws into force, and the policy landscape changes month to
      month. For producers operating across multiple states, tracking obligations, registration
      deadlines, fee structures, and compliance windows is a continuous workload. This tracker
      presents the Sustainable Packaging Coalition's EPR Policy Database in a navigable form so
      producers, consultants, and researchers can find the answer to a specific question fast.
    </p>
  </section>

<template id="tpl-about">
  <article class="prose">
    <h1>About this Tracker</h1>
    <p>
      This tracker presents United States packaging Extended Producer Responsibility (EPR) bills and laws,
      based on the <a href="https://epr.sustainablepackaging.org/policies" target="_blank" rel="noopener">Sustainable Packaging Coalition / GreenBlue EPR Policy Database</a>.
      Data refreshes daily directly from SPC; no manual export step.
    </p>

    <h2>What is EPR?</h2>
    <p>
      Extended Producer Responsibility (EPR) is a policy approach that assigns producers responsibility for the end-of-life of products.
      This can include both financial responsibility and operational responsibility, though the amount and type may differ.
      Producers are required to provide funding and/or services that assist in managing covered products after the use phase.
    </p>
    <p>
      Most EPR programs for packaging encourage or require producers of packaging products to join a collective producer responsibility organization (PRO),
      though many allow producers to comply individually. The PRO then develops a producer responsibility plan and manages the producer responsibility program.
      In some states, these components are referred to as a stewardship organization and stewardship plan. PROs are typically required to be nonprofit organizations,
      and a common approach is to allow for multiple PROs to operate within a single region's EPR program.
    </p>
    <p>
      The financial structure may vary, but in most EPR programs producers pay fees to the PRO. The PRO then distributes the funds to cover the costs required by program legislation.
      Costs generally provide funding for the end-of-life management of covered products (collection, sortation, processing). Covered products are either defined in legislation or in the producer responsibility plan,
      and are the specific items or materials that must be managed within the program.
    </p>
    <p>
      Many new bills and positions extend cost coverage to include outreach and education, infrastructure improvements, and end-market development for recycled materials.
      Organizations and policymakers are increasingly pointing to effective EPR as a necessary component of a comprehensive approach to addressing recycling challenges and concern over single-use product pollution.
    </p>

    <h2>Elements of EPR</h2>
    <p>
      The breakdown below identifies key elements and the options within those elements that are present in various approaches.
      Each element is a key component of the policy, and the options within each element represent common ways that the element is implemented.
    </p>
    <p>
      For example, the element <strong>Covered Products</strong> refers to the types of items required to be included within the producer responsibility program.
      Within that element are different options, such as <strong>All Packaging Types</strong> or <strong>Paper Products</strong>.
      The actual scope of these options varies by bill and is explained in more detail on each individual bill page.
    </p>
    <p>
      Some options are either/or, but most elements include multiple options together. The absence of an option within a category does not mean the program will not include that component,
      only that it was not included in the bill language. Many EPR proposals specify what should be included in the plan, but the details are left to be determined during plan development by the PRO.
    </p>

    <h3>Elements tracked</h3>
    <div data-slot="elements-list"></div>
  </article>
