name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh data daily at 06:00 UTC (about 02:00 EDT, 23:00 PDT)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest data from SPC EPR Policy Database
        run: python scripts/fetch_spc.py

      - name: Verify generated data
        run: |
          test -f data/policies.json
          test -f data/aggregates.json
          test -f data/fields.json
          ls -la data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
